<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 760" role="img" aria-labelledby="title desc">
  <title id="title">芝士汉堡畅画笔</title>
  <desc id="desc">一支由芝麻面包、生菜、芝士、番茄和烤肉排组成的汉堡主题画笔</desc>
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a2"/>
      <stop offset=".55" stop-color="#eaa34f"/>
      <stop offset="1" stop-color="#b9682d"/>
    </linearGradient>
    <linearGradient id="bunLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff0c5"/>
      <stop offset="1" stop-color="#d98538"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6d3526"/>
      <stop offset=".55" stop-color="#4b211b"/>
      <stop offset="1" stop-color="#281314"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff06b"/>
      <stop offset=".7" stop-color="#f4bb27"/>
      <stop offset="1" stop-color="#d88a18"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5e5e4"/>
      <stop offset=".36" stop-color="#69a6a1"/>
      <stop offset=".72" stop-color="#27716f"/>
      <stop offset="1" stop-color="#163f4a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#24120e" flood-opacity=".27"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Slim core keeps the food layers readable as one drawing pen. -->
  <path d="M143 145h34v338h-34z" fill="#31201e" opacity=".88"/>
  <path d="M150 151h9v319h-9z" fill="#fff1c2" opacity=".2"/>

  <g filter="url(#shadow)">
    <!-- sesame bun cap -->
    <path d="M48 127c5-49 49-80 112-80s107 31 112 80c-26 21-66 32-112 32S74 148 48 127Z" fill="url(#bun)" stroke="#8f4d29" stroke-width="6"/>
    <path d="M58 119c15-34 52-53 102-53 47 0 85 17 101 50-27 13-62 19-101 19-40 0-76-5-102-16Z" fill="url(#bunLight)" opacity=".65"/>
    <g fill="#fff1b7" stroke="#c57b36" stroke-width="2">
      <ellipse cx="101" cy="88" rx="8" ry="3.5" transform="rotate(-24 101 88)"/>
      <ellipse cx="135" cy="72" rx="8" ry="3.5" transform="rotate(-8 135 72)"/>
      <ellipse cx="175" cy="70" rx="8" ry="3.5" transform="rotate(12 175 70)"/>
      <ellipse cx="214" cy="88" rx="8" ry="3.5" transform="rotate(27 214 88)"/>
      <ellipse cx="77" cy="112" rx="7" ry="3" transform="rotate(-17 77 112)"/>
      <ellipse cx="246" cy="113" rx="7" ry="3" transform="rotate(18 246 113)"/>
    </g>

    <!-- lettuce -->
    <path d="M43 133c13-11 21 10 34-1 14-12 22 10 37-1 15-11 23 10 39-1 15-11 24 10 39-1 15-11 24 10 39-1 15-11 23 10 37-1 13-10 20 11 29 2l-5 31c-17 13-30-7-44 5-16 13-25-8-40 4-16 13-24-8-40 4-16 13-25-8-40 4-16 13-24-8-39 4-15 12-25-7-40 1Z" fill="#53bd62" stroke="#237849" stroke-width="6" stroke-linejoin="round"/>
    <path d="M57 151c20 8 39 8 57 1m27 3c18 6 37 6 55-1m28 0c15 6 27 4 40-2" fill="none" stroke="#a8ea78" stroke-width="5" stroke-linecap="round" opacity=".72"/>

    <!-- cheese slice with a corner drip -->
    <path d="M50 166h220l-9 53-37-8-22 41-32-32-35 17-22-25-56 12Z" fill="url(#cheese)" stroke="#bd7918" stroke-width="6" stroke-linejoin="round"/>
    <path d="M69 178h181" stroke="#fff59a" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M228 210v25c0 8 12 8 12 0v-21" fill="#edb62b" stroke="#bd7918" stroke-width="4"/>

    <!-- grilled patty barrel -->
    <path d="M46 220c18-13 39-5 57-6 20-2 37 6 57 5 22-1 38-7 57-5 20 1 40-7 57 7l-5 63c-17 17-39 13-57 14-20 1-37-6-56-5-20 0-39 7-58 5-20-2-39 4-57-13Z" fill="url(#patty)" stroke="#2b1715" stroke-width="7"/>
    <path d="M70 244l31 19m-4-25 31 19m59-15 31 20m-3-28 28 18" stroke="#c6783f" stroke-width="6" stroke-linecap="round" opacity=".72"/>
    <path d="M60 276c26 10 50-1 75 3 23 4 43-5 67-1 23 4 40-4 57-2" fill="none" stroke="#9a4c31" stroke-width="5" stroke-linecap="round"/>

    <!-- tomato and sauce stripe -->
    <path d="M43 287c19-10 37 4 57-1 21-5 37 6 57 1 22-5 38 6 59 0 21-6 39 8 61-1l-6 35c-20 10-39-3-60 2-22 6-38-5-59 0-21 6-39-5-59 0-20 5-37-7-55 1Z" fill="#ee5543" stroke="#a53231" stroke-width="6"/>
    <path d="M58 298c28 9 49-2 73 2 23 4 42-5 66-1 22 4 40-5 66 0" fill="none" stroke="#ff9870" stroke-width="7" stroke-linecap="round" opacity=".68"/>
    <path d="M67 326c21 7 40-5 61 0 22 5 39-5 60 0 22 5 42-5 64 0" fill="none" stroke="#e88932" stroke-width="8" stroke-linecap="round"/>

    <!-- lower bun grip -->
    <path d="M48 340c26-10 58-1 112-1 55 0 86-9 112 1l-7 58c-29 26-66 28-105 28s-76-2-105-28Z" fill="url(#bun)" stroke="#8f4d29" stroke-width="6"/>
    <path d="M68 368c28 12 59 9 92 10 34 1 67 2 93-9" fill="none" stroke="#ffd98b" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <g fill="#fff0b0" opacity=".85">
      <ellipse cx="93" cy="388" rx="6" ry="2.5" transform="rotate(-15 93 388)"/>
      <ellipse cx="132" cy="400" rx="6" ry="2.5" transform="rotate(8 132 400)"/>
      <ellipse cx="190" cy="397" rx="6" ry="2.5" transform="rotate(-9 190 397)"/>
      <ellipse cx="228" cy="384" rx="6" ry="2.5" transform="rotate(15 228 384)"/>
    </g>

    <!-- turquoise metal collar and graphite nib -->
    <path d="M113 414h94l-6 36h-82Z" fill="#163f4a" stroke="#102d39" stroke-width="6"/>
    <path d="M119 420h82l-4 13h-75Z" fill="#72c6b6" opacity=".85"/>
    <path d="M128 449h64l-10 36h-44Z" fill="#d7a13a" stroke="#70451f" stroke-width="5"/>
    <path d="M137 484h46l-23 184Z" fill="url(#nib)" stroke="#123949" stroke-width="6"/>
    <path d="M160 500v125" stroke="#c7f2e4" stroke-width="5" opacity=".5"/>
    <path d="M160 668 145 705l15 30 15-30Z" fill="#172b36" stroke="#102431" stroke-width="5"/>
    <path d="M160 681v42" stroke="#89c8bd" stroke-width="3" opacity=".55"/>
  </g>

  <!-- tiny warm highlight, not a drawing trail -->
  <ellipse cx="111" cy="116" rx="28" ry="7" fill="#fff3c4" opacity=".2" filter="url(#soft)"/>
</svg>
